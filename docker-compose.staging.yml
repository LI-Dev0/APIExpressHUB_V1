version: '3.8'

services:
  server:
    image: ghcr.io/${{ GITHUB_REPOSITORY }}:latest
    environment:
      NODE_ENV: staging
      LOG_LEVEL: info
      # Add staging-specific vars
      #API_URL: https://staging-api.your-domain.com
      #DATABASE_URL: ${{ STAGING_DB_URL }}
    restart: always
    ports:
      - "4747:4747"
    # volumes: (not needed for production deployments)
    # command: (use default from Dockerfile)
    
    # Optional: Add health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4747/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

