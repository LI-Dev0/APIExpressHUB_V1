name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_ENV: staging  # CHANGE: assign 'production' after k8s integration
  LOG_LEVEL: info

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Application
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}  # Default to staging, change to production as needed when k8s is set up
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # CHANGE: was 18, now 20 across all workflows
          cache: 'npm'

      # ADD: Clean cache before install
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --verbose
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run Tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy to Docker Compose (Staging)
        if: github.event.inputs.environment == 'staging'
        run: |
          echo "Deploying to staging environment..."
          docker-compose -f docker-compose.staging.yml pull
          docker-compose -f docker-compose.staging.yml down
          docker-compose -f docker-compose.staging.yml up -d
          docker-compose -f docker-compose.staging.yml exec -T server npm run migrate --if-present
          echo "✅ Staging deployment complete"

      # Example: SSH to staging server and pull latest image
      
      #- name: Deploy to Kubernetes (Production)
       # if: github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'
        #uses: appleboy/ssh-action@master
        #with:
         # host: ${{ secrets.PROD_HOST }}
          #username: ${{ secrets.PROD_USERNAME }}
          #key: ${{ secrets.PROD_SSH_KEY }}
          #script: |
          #  cd /opt/apiexpresshub
          #  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          #  docker-compose down
          #  docker-compose up -d
          #  docker-compose exec -T server npm run migrate --if-present

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.deploy.result }}';
            const environment = '${{ github.event.inputs.environment || "staging" }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const message = `${emoji} Deployment to ${environment}: ${status.toUpperCase()}`;
            console.log(message);
            
            // OPTIONAL: Add comment to related PR/commit
            if (context.issue.number) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
