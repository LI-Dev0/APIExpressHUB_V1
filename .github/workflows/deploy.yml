name: Deploy to Staging

on:
  push:
    branches: [ root ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
      
      - name: Run Tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # ADD: Extract metadata (like build.yml)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  determine-environment:
    runs-on: ubuntu-latest
    name: Determine Deployment Environment
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set deployment environment
        id: set-env
        run: |
          # If manual trigger, use selected environment
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          # If tag push (v*), deploy to production
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          # If push to main, deploy to staging
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: [build-and-push, determine-environment]
    runs-on: ubuntu-latest
    name: Deploy to ${{ needs.determine-environment.outputs.environment }}
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Staging
        if: needs.determine-environment.outputs.environment == 'staging'
        run: |
          echo "🚀 Deploying to STAGING environment..."
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          
          # Pull latest image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          
          # Stop and remove old containers
          docker-compose -f docker-compose.staging.yml down || true
          
          # Start new containers
          docker-compose -f docker-compose.staging.yml up -d
          
          # Run migrations
          docker-compose -f docker-compose.staging.yml exec -T server npm run migrate --if-present
          
          echo "✅ Staging deployment complete"

      - name: Deploy to Production (Kubernetes)
        if: needs.determine-environment.outputs.environment == 'production'
        run: |
          echo "🚀 Deploying to PRODUCTION environment..."
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          
          # Placeholder for K8s deployment
          # Uncomment when K8s is ready
          # kubectl set image deployment/apiexpresshub-api \
          #   api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          #   -n production
          
          echo "⚠️ Production deployment not yet configured (K8s setup required)"

  notify:
    needs: [deploy, determine-environment]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            const deployStatus = '${{ needs.deploy.result }}';
            const environment = '${{ needs.determine-environment.outputs.environment }}';
            const emoji = deployStatus === 'success' ? '✅' : '❌';
            
            const message = `${emoji} **Deployment to ${environment}**: ${deployStatus.toUpperCase()}
            
            - Event: ${{ github.event_name }}
            - Ref: ${{ github.ref }}
            - Commit: ${{ github.sha }}`;
            
            console.log(message);
            
            // Comment on PR if applicable
            if (context.issue.number) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }
