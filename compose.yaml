version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "4747:4747"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules  # Prevent overwriting container node_modules
    command: npm start

